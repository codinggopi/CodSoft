<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QuizSphere</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="blob"></div>
    <div class="blob" style="bottom: 0; right: 0; animation-delay: -5s;"></div>

    <div class="auth-card-saas glass card-modern" data-aos="zoom-in">
        <div class="auth-visual">
            <i class="fas fa-user-shield"></i>
            <h2 class="mt-4 text-white">Welcome Back!</h2>
            <p class="text-white opacity-70 text-center mt-2">Log in to continue your journey and challenge your knowledge with the community.</p>
        </div>
        <div class="auth-form-container">
            <div class="auth-header mb-4">
                <h1 class="gradient-text">Sign In</h1>
                <p class="text-muted">Enter your details to access your dashboard.</p>
            </div>

            <div id="error-message" class="error-card" style="display: none;">
                <i class="fas fa-exclamation-circle"></i>
                <span>Invalid email or password.</span>
            </div>

            <form id="login-form">
                <div class="form-group mb-4">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required placeholder="name@company.com">
                </div>
                <div class="form-group mb-4">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" required placeholder="••••••••">
                        <i class="fas fa-eye password-toggle" id="toggle-password"></i>
                    </div>
                </div>
                <div class="auth-footer mb-4">
                    <label class="d-flex align-center gap-2 cursor-pointer">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="text-primary font-bold">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-full mb-4">
                    Login to QuizSphere
                </button>
            </form>
            <p class="text-center text-muted">
                Don't have an account? <a href="register.html" class="text-primary font-bold">Sign Up Free</a>
            </p>
            <div class="text-center mt-4">
                <a href="index.html" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
