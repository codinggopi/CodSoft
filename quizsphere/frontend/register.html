<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - QuizSphere</title>
    <link rel="icon" type="image/png" href="quizsphere.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="blob"></div>
    <div class="blob" style="top: 0; left: 0; animation-delay: -3s;"></div>

    <div class="auth-card-saas glass card-modern" data-aos="zoom-in">
        <div class="auth-visual">
            <i class="fas fa-rocket"></i>
            <h2 class="mt-4 text-white">Join the Community!</h2>
            <p class="text-white opacity-70 text-center mt-2">Start creating and taking quizzes with thousands of other learners worldwide.</p>
        </div>
        <div class="auth-form-container">
            <div class="auth-header mb-4">
                <h1 class="gradient-text">Create Account</h1>
                <p class="text-muted">Fill in your details to get started.</p>
            </div>

            <form id="register-form">
                <div class="form-group mb-3">
                    <label>Full Name</label>
                    <input type="text" id="fullname" class="form-control" required placeholder="John Doe">
                </div>
                <div class="form-group mb-3">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required placeholder="name@company.com">
                </div>
                <div class="form-group mb-3">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" required placeholder="••••••••">
                        <i class="fas fa-eye password-toggle" id="toggle-password"></i>
                    </div>
                    <div class="strength-meter">
                        <div id="strength-bar" class="strength-bar"></div>
                    </div>
                    <small id="password-hint" class="text-muted mt-1 d-block">Min 8 chars, uppercase, lowercase, number & symbol.</small>
                </div>
                <div class="form-group mb-4">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-full mb-4">
                    Create Free Account
                </button>
            </form>
            <p class="text-center text-muted">
                Already have an account? <a href="login.html" class="text-primary font-bold">Sign In</a>
            </p>
            <div class="text-center mt-4">
                <a href="index.html" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
