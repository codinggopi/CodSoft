<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Jobs | CareerConnect</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .saas-container {
            max-width: 1400px;
            width: 92%;
            margin: 0 auto;
            padding: 2rem 0;
        }

        .saas-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .saas-section {
            margin-top: 32px;
            margin-bottom: 48px;
        }
    </style>
    <link rel="icon" type="image/jpeg" href="assets/carrerconnect.jpeg">
</head>

<body class="flex flex-col" style="min-height: 100vh;">
    <nav class="navbar">
        <div class="container flex justify-between items-center">
            <a href="index.html" class="nav-brand"><i class="fas fa-briefcase"></i> CareerConnect</a>
            <div class="nav-links" id="navLinks">
                <!-- Links injected by theme.js -->
            </div>
        </div>
    </nav>

    <div class="saas-container animate-fade-in" style="flex: 1;">
        <div class="flex justify-between items-center mb-6 mt-4">
            <h1 style="font-size: 2.5rem; margin: 0;">Manage Jobs</h1>
            <button onclick="window.location.href='post-job.html'" class="btn btn-primary"
                style="border-radius: 12px;"><i class="fas fa-plus mr-2"></i>Post New Job</button>
        </div>

        <div class="saas-section saas-card">
            <div class="jobs-grid" id="dashJobsGrid">
                <p class="text-muted">Loading jobs...</p>
            </div>
        </div>
    </div>

    <!-- Expanded Footer -->
        <footer class="footer-compact mt-auto" style="background: var(--card-bg); border-top: 1px solid var(--border-color); padding: 1.5rem 0; margin-top: auto;">
        <div class="container flex justify-between items-center" style="flex-wrap: wrap; gap: 1rem;">
            <div style="font-weight: bold; color: var(--primary-color);">
                <i class="fas fa-briefcase"></i> CareerConnect
            </div>
            <div class="flex gap-4" style="font-size: 0.875rem;">
                <a href="#" style="color: var(--text-color); text-decoration: none;">About</a>
                <a href="contact.html" style="color: var(--text-color); text-decoration: none;">Contact</a>
                <a href="#" style="color: var(--text-color); text-decoration: none;">Privacy</a>
                <a href="#" style="color: var(--text-color); text-decoration: none;">Terms</a>
            </div>
            <div style="font-size: 0.875rem; color: var(--text-muted);">
                &copy; 2026 CareerConnect
            </div>
        </div>
    </footer>

    <script src="assets/js/theme.js"></script>
    <script>
        const API_URL = "https://careerconnect-navy.vercel.app";
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');
            if (!token || !userStr) { window.location.href = 'login.html'; return; }
            currentUser = JSON.parse(userStr);
            if (currentUser.role !== 'employer') { window.location.href = 'index.html'; return; }

            fetchJobs(token);
        });

        async function fetchJobs(token) {
            try {
                const res = await fetch(`${API_URL}/jobs/`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const allJobs = await res.json();
                    const myJobs = allJobs.filter(j => j.employer_id === currentUser.id);
                    renderJobs(myJobs);
                } else {
                    document.getElementById('dashJobsGrid').innerHTML = '<p class="text-danger">Failed to load jobs.</p>';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('dashJobsGrid').innerHTML = '<p class="text-danger">Error loading jobs.</p>';
            }
        }

        function renderJobs(jobs) {
            const grid = document.getElementById('dashJobsGrid');
            if (!jobs.length) {
                grid.innerHTML = '<p class="text-muted">No active jobs found. <a href="post-job.html">Post one now.</a></p>';
                return;
            }

            grid.innerHTML = jobs.map(job => `
                <div class="job-card" style="position:relative; padding: 1.5rem;">
                    <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom: 1rem;">
                        <div>
                            <h3 style="margin-bottom: 0.5rem; font-size: 1.25rem;">${job.title}</h3>
                            <p class="text-muted text-sm mb-0"><i class="fas fa-map-marker-alt mr-1"></i> ${job.location} &nbsp;&bull;&nbsp; ${job.job_type}</p>
                        </div>
                        <span class="badge badge-success">Active</span>
                    </div>
                    <div class="flex items-center justify-between mt-4 pt-4 border-top">
                        <div class="text-sm font-weight-500 text-primary"><i class="fas fa-money-bill-wave mr-1"></i> ${job.salary || 'Competitive'}</div>
                        <button onclick="deleteJob(${job.id})" class="btn btn-outline" style="color:var(--danger); border-color:var(--danger); padding:0.25rem 0.5rem; font-size:0.875rem;"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        async function deleteJob(jobId) {
            if (!confirm("Are you sure you want to delete this job?")) return;
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_URL}/jobs/${jobId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    fetchJobs(token);
                } else {
                    alert("Failed to delete job.");
                }
            } catch (e) { console.error(e); }
        }

        function logoutUser(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
