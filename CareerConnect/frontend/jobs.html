<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs | CareerConnect</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/jpeg" href="assets/carrerconnect.jpeg">
</head>

<body class="flex flex-col" style="min-height: 100vh;">
    <nav class="navbar">
        <div class="container flex justify-between items-center">
            <a href="index.html" class="nav-brand"><i class="fas fa-briefcase"></i> CareerConnect</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="jobs.html" style="color: var(--primary-color);">Find Jobs</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
                    <i id="theme-icon" class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container animate-fade-in section-padding" style="flex: 1;">
        <div class="jobs-layout">
            
            <aside class="card h-fit filter-sidebar" style="position: sticky; top: 100px;">
                <div class="flex justify-between items-center mb-6"
                    style="border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem;">
                    <h3 style="font-size: 1.25rem;"><i class="fas fa-filter mr-2 text-primary"></i> Filters</h3>
                    <div>
                        <button type="button" class="btn"
                            style="padding: 0.25rem; background: none; border: none; color: var(--text-muted); font-size: 0.875rem; text-decoration: underline;"
                            onclick="document.getElementById('searchForm').reset(); fetchJobs();">Clear</button>
                        <button type="button" class="btn mobile-close-btn" style="padding: 0.25rem; background: none; border: none; color: var(--danger); display: none; font-size: 1.25rem;" onclick="document.querySelector('.filter-sidebar').classList.remove('show-mobile-filters')"><i class="fas fa-times"></i></button>
                    </div>
                </div><br>

                <form id="searchForm" class="flex flex-col gap-4">
                    <div class="form-group mb-0">
                        <label class="form-label" style="font-size: 0.875rem;">Search</label>
                        <div class="input-with-icon">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchKeyword" class="form-control"
                                placeholder="Job Title or Keyword">
                        </div>
                    </div>

                    <div class="form-group mb-0">
                        <label class="form-label" style="font-size: 0.875rem;">Location</label>
                        <div class="input-with-icon">
                            <i class="fas fa-map-marker-alt"></i>
                            <input type="text" id="searchLocation" class="form-control" placeholder="City or Country">
                        </div>
                    </div>

                    <div class="form-group mb-0">
                        <label class="form-label" style="font-size: 0.875rem;">Job Type</label>
                        <select id="searchType" class="form-control">
                            <option value="">All Job Types</option>
                            <option value="Full Time">Full Time</option>
                            <option value="Part Time">Part Time</option>
                            <option value="Internship">Internship</option>
                            <option value="Contract">Contract</option>
                        </select>
                    </div>

                    <div class="form-group mb-0">
                        <label class="form-label" style="font-size: 0.875rem;">Experience Level</label>
                        <select id="searchExperience" class="form-control">
                            <option value="">Any Experience</option>
                            <option value="Entry Level">Entry Level</option>
                            <option value="Mid Level">Mid Level</option>
                            <option value="Senior">Senior</option>
                        </select>
                    </div>

                    <div class="form-group mb-0 mt-2">
                        <label class="flex items-center"
                            style="cursor: pointer; font-size: 0.875rem; font-weight: 500;">
                            <input type="checkbox" id="searchRemote"
                                style="margin-right: 0.5rem; transform: scale(1.2);"> Remote Only
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-full mt-4">Apply Filters</button>
                </form>
            </aside>

            
            <main>
                <div class="flex justify-between items-center mb-6" style="flex-wrap: wrap; gap: 1rem;">
                    <h1 style="font-size: 2rem;">Explore Opportunities</h1>
                    <div style="display: flex; gap: 1rem; align-items: center; width: 100%; justify-content: space-between;" class="flex-row-mobile">
                        <button class="btn btn-outline mobile-filter-btn" style="display: none; align-items: center; gap: 0.5rem;" onclick="document.querySelector('.filter-sidebar').classList.add('show-mobile-filters')">
                            <i class="fas fa-filter"></i> Filters
                        </button>
                        <div class="text-muted" style="font-size: 0.875rem; text-align: right; flex: 1;">
                            Showing <span id="jobsCount" style="font-weight: 600; color: var(--text-color);">0</span>
                            results
                        </div>
                    </div>
                </div>

                <div id="jobsList" class="job-cards-grid">
                    
                    <div style="grid-column: 1 / -1; padding: 4rem 1rem; text-align: center;">
                        <i class="fas fa-spinner fa-spin text-primary" style="font-size: 2rem;"></i>
                        <p class="mt-4 text-muted">Loading jobs...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    
        <footer class="footer-compact mt-auto" style="background: var(--card-bg); border-top: 1px solid var(--border-color); padding: 1.5rem 0; margin-top: auto;">
        <div class="container flex justify-between items-center" style="flex-wrap: wrap; gap: 1rem;">
            <div style="font-weight: bold; color: var(--primary-color);">
                <i class="fas fa-briefcase"></i> CareerConnect
            </div>
            <div class="flex gap-4" style="font-size: 0.875rem;">
                <a href="javascript:void(0)" style="color: var(--text-color); text-decoration: none;">About</a>
                <a href="contact.html" style="color: var(--text-color); text-decoration: none;">Contact</a>
                <a href="javascript:void(0)" style="color: var(--text-color); text-decoration: none;">Privacy</a>
                <a href="javascript:void(0)" style="color: var(--text-color); text-decoration: none;">Terms</a>
            </div>
            <div style="font-size: 0.875rem; color: var(--text-muted);">
                &copy; 2026 CareerConnect
            </div>
        </div>
    </footer>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/jobs.js"></script>
</body>

</html>
