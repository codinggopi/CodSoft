<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details | CareerConnect</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/jpeg" href="assets/carrerconnect.jpeg">
</head>

<body class="flex flex-col" style="min-height: 100vh;">
    <nav class="navbar">
        <div class="container flex justify-between items-center">
            <a href="index.html" class="nav-brand"><img src="assets/carrerconnect.jpeg" alt="Logo" style="height: 30px; margin-right: 8px; vertical-align: middle;"> CareerConnect</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="jobs.html" style="color: var(--primary-color);">Find Jobs</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
                    <i id="theme-icon" class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container animate-fade-in section-padding" style="flex: 1;" id="jobDetailsContainer">

        <p class="text-center text-muted">Loading job details...</p>
    </div>


    <footer class="footer-compact mt-auto"
        style="background: var(--card-bg); border-top: 1px solid var(--border-color); padding: 1.5rem 0; margin-top: auto;">
        <div class="container flex justify-between items-center" style="flex-wrap: wrap; gap: 1rem;">
            <div style="font-weight: bold; color: var(--primary-color);">
                <img src="assets/carrerconnect.jpeg" alt="Logo" style="height: 30px; margin-right: 8px; vertical-align: middle;"> CareerConnect
            </div>
            <div class="flex gap-4" style="font-size: 0.875rem;">
                <a href="javascript:void(0)" style="color: var(--text-color); text-decoration: none;">About</a>
                <a href="contact.html" style="color: var(--text-color); text-decoration: none;">Contact</a>
                <a href="javascript:void(0)" style="color: var(--text-color); text-decoration: none;">Privacy</a>
                <a href="javascript:void(0)" style="color: var(--text-color); text-decoration: none;">Terms</a>
            </div>
            <div style="font-size: 0.875rem; color: var(--text-muted);">
                &copy; 2026 CareerConnect
            </div>
        </div>
    </footer>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/jobs.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const jobId = urlParams.get('id');
            const container = document.getElementById('jobDetailsContainer');

            if (!jobId) {
                container.innerHTML = '<p class="text-center text-danger">Invalid Job ID.</p>';
                return;
            }

            let job = null;
            let isDemo = false;

            if (jobId.startsWith('demo-')) {
                job = window.demoJobs.find(j => j.id === jobId);
                isDemo = true;
            } else {
                try {
                    const res = await fetch(`${API_BASE_URL}/jobs/`);
                    if (res.ok) {
                        const jobs = await res.json();
                        job = jobs.find(j => j.id == jobId);
                    }
                } catch (err) {
                    console.error("Failed to fetch jobs API", err);
                }
            }

            if (!job) {
                container.innerHTML = '<p class="text-center text-danger">Job not found.</p>';
                return;
            }

            const initial = job.company ? job.company.charAt(0).toUpperCase() : 'C';

            let applySectionHtml = '';
            if (isDemo) {
                applySectionHtml = `
                    <div style="background: rgba(239, 68, 68, 0.1); border-left: 4px solid var(--danger); padding: 1.5rem; border-radius: 0.5rem; margin-top: 2rem;">
                        <h4 style="color: var(--danger); margin-bottom: 0.5rem;"><i class="fas fa-exclamation-triangle mr-2"></i> Demo Job</h4>
                        <p style="color: var(--text-color);">This is a sample listing. Applications are only available for employer-posted jobs.</p>
                        <button class="btn mt-4 w-full" style="background: var(--border-color); color: var(--text-muted); cursor: not-allowed;" disabled>Apply Now</button>
                    </div>
                `;
            } else {
                applySectionHtml = `
                    <div class="card mt-8" style="background: var(--card-bg);">
                        <h3 class="mb-4">Ready to Apply?</h3>
                        <button class="btn btn-primary w-full" onclick="openApplyModal('${job.id}')" style="font-size: 1.1rem; padding: 1rem;">Apply for this Job</button>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="card mb-8">
                    <div class="flex items-center gap-6 mb-6" style="display: flex; align-items: center; gap: 1.5rem;">
                        <div class="company-logo-placeholder" style="width: 80px; height: 80px; font-size: 2.5rem; border-radius: 1rem;">${initial}</div>
                        <div>
                            <h1 style="font-size: 2rem;text-align: center; margin-bottom: 0.5rem;">${job.title}</h1>
                            <div class="flex items-center gap-4 flex-wrap" style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                                <p class="text-lg text-muted" style="margin: 0;"><i class="fas fa-building mr-2" style="margin-right: 0.5rem;"></i>${job.company}</p>
                                ${!isDemo && job.employer_id ? `<a href="public-company-profile.html?employer_id=${job.employer_id}" class="btn btn-outline" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;"><i class="fas fa-external-link-alt mr-2" style="margin-right: 0.5rem;"></i>View Company Profile</a>` : ''}
                            </div><br>
                        </div>
                    </div>

                    <div class="flex gap-6 mb-8 text-muted" style="display: flex; flex-wrap: wrap; gap: 1.5rem; font-size: 1.1rem; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 1.5rem 0;">
                        <span><i class="fas fa-map-marker-alt mr-2" style="margin-right: 0.5rem;"></i>   ${job.location}</span>
                        <span><i class="fas fa-money-bill-wave mr-2" style="margin-right: 0.5rem;"></i>   ${job.salary}</span>
                        <span><i class="fas fa-briefcase mr-2" style="margin-right: 0.5rem;"></i>   ${job.job_type}</span>
                    </div>

                    <div class="job-details-layout">
                        <div>
                            <h3 class="mb-4">Job Description</h3>
                            <p class="text-muted mb-8" style="white-space: pre-line; line-height: 1.8;">   ${job.description}</p>

                            <h3 class="mb-4">Requirements</h3>
                            <p class="text-muted mb-8" style="white-space: pre-line; line-height: 1.8;">   ${job.requirements}</p>

                            <h3 class="mb-4">Skills Needed</h3>
                            <div class="flex gap-2" style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                                ${(job.skills || '').split(',').map(s => `<span class="badge badge-warning" style="font-size: 1rem; padding: 0.5rem 1rem;">${s.trim()}</span>`).join('')}
                            </div>
                        </div>

                        <div>
                            ${applySectionHtml}
                        </div>
                    </div>
                </div>
            `;

            // Related Jobs Logic
            let relatedJobs = [];
            if (isDemo) {
                relatedJobs = window.demoJobs.filter(j => j.id !== jobId).slice(0, 3);
            } else {
                try {
                    const res = await fetch(`${API_BASE_URL}/jobs/`);
                    if (res.ok) {
                        const allJobs = await res.json();
                        relatedJobs = allJobs.filter(j => j.id != jobId).slice(0, 3);
                    }
                } catch (e) { }
            }

            if (relatedJobs.length > 0) {
                const relatedHtml = `
                    <div class="mt-12 mb-8">
                        <h2 class="mb-6">Related Jobs</h2>
                        <div class="job-cards-grid">
                            ${relatedJobs.map(j => window.generateJobCard(j, isDemo)).join('')}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', relatedHtml);
            }
        });

        window.openApplyModal = function (jobId) {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');

            if (!token || !userStr) {
                alert("Please log in as a Candidate to apply for jobs.");
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(userStr);
            if (user.role !== 'candidate') {
                alert("Only candidates can apply for jobs.");
                return;
            }

            const modalHtml = `
                <div id="applyModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
                    <div class="card animate-fade-in" style="width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
                        <div class="flex justify-between items-center mb-6" style="border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
                            <h3 style="margin: 0;">Submit Application</h3>
                            <button class="btn btn-outline" style="border: none; padding: 0.5rem;" onclick="document.getElementById('applyModal').remove()"><i class="fas fa-times"></i></button>
                        </div>
                        <form id="applyForm">
                            <input type="hidden" name="job_id" value="${jobId}">
                            
                            <div class="form-group">
                                <label class="form-label">Resume (PDF, DOC, DOCX)</label>
                                <input type="file" name="resume" class="form-control" accept=".pdf,.doc,.docx" required>
                                <p class="text-muted text-sm mt-2">Required. Maximum size: 5MB.</p>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Cover Letter (Optional)</label>
                                <textarea name="cover_letter" class="form-control" rows="4" placeholder="Briefly explain why you are a good fit..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-full mt-4" id="submitApplyBtn">Submit Application</button>
                        </form>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHtml);

            document.getElementById('applyForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const form = e.target;
                const submitBtn = document.getElementById('submitApplyBtn');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Submitting...';

                const formData = new FormData(form);

                try {
                    const res = await fetch(`${API_BASE_URL}/applications/apply`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });

                    if (res.ok) {
                        // STORE CANDIDATE METADATA IN LOCALSTORAGE FOR THE EMPLOYER DASHBOARD
                        // Since backend doesn't return name/email in Application endpoint.
                        const app = await res.json();
                        const candidateData = { name: user.name, email: user.email };
                        localStorage.setItem(`candidate_${user.id}`, JSON.stringify(candidateData));

                        alert("Application submitted successfully! The employer has been notified.");
                        document.getElementById('applyModal').remove();
                    } else {
                        const err = await res.json();
                        alert(err.detail || "Failed to submit application.");
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = 'Submit Application';
                    }
                } catch (error) {
                    console.error(error);
                    alert("An error occurred connecting to the server.");
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Submit Application';
                }
            });
        }
    </script>
</body>

</html>
